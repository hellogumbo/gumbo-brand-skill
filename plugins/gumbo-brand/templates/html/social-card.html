<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gumbo Social Card</title>
  <style>
{{THEME_CSS}}
  </style>
</head>
<body class="preview">
  <main class="page page--social immersive">
    <div class="social-content">
      <section class="social-copy">
        <div class="wordmark">{{WORDMARK_WHITE}}</div>
        <div>
          <p class="overline" style="margin-bottom:16px;color:rgba(255,255,255,.65);">Announcement</p>
          <h1>Put one strong idea here.</h1>
        </div>
        <p style="color:rgba(255,255,255,.65);font-size:15px;">hellogumbo.com · {{DATE}}</p>
      </section>
      <div class="social-image">
        <img src="{{PHOTO_DATA_URI}}" alt="">
      </div>
    </div>
  </main>
</body>
</html>
